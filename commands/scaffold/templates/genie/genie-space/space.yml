# Genie space definition — the single source of truth for this space.
# Long prose (description, instructions) lives in the referenced .md files, not
# inline here, so it stays easy to write and review. deploy_genie.py assembles
# them into the serialized_space payload.
#
# Leave space_id empty to CREATE a new space; the deploy script writes the new id
# back here. A set space_id means UPDATE the existing space.
space_id: ""                      # set by deploy on first create; do not edit by hand
title: "TPLVAR_DISPLAY_NAME"
warehouse_id: TODO_SET_WAREHOUSE_ID

# Prose lives in these files (relative to this space.yml):
description_file: description.md
instructions_file: instructions.md

# Curated example question -> SQL pairs that teach Genie the right query patterns
# (few-shot). OPTIONAL: the file ships as a commented template; leave its list
# empty and nothing is sent. deploy_genie.py includes any entries present.
example_queries_file: example_queries.yml

# Tables / metric views Genie can query. START EMPTY — point the space at your
# own curated gold tables (Genie should read curated tables/views, not raw data).
# See docs/GENIE_STANDARDS.md §5. Add a bespoke backing view under views/ only if
# you need one; then list it here too.
#   e.g.  tables:
#           - TPLVAR_CATALOG.gold.your_curated_table
data_sources:
  tables: []
  metric_views: []

uc_functions: []                  # functions/*.sql attached to the space

# Sample questions surfaced as starter chips in the Genie UI. These are TEMPLATE
# placeholders — replace with real questions for your data (keep them answerable
# from the data_sources above).
sample_questions:
  - "TODO: a representative question a user would ask this space"
  # - "How many active customers are there by region?"
  # - "What was total revenue last month?"
