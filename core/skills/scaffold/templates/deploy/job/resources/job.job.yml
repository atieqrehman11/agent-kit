# Notebook paths are relative to this file. Serverless, so no policy_id; tasks
# take explicit base_parameters, so a run shows the parameters it used.
resources:
  jobs:
    TPLVAR_RESOURCE_KEY:
      name: "TPLVAR_APP_NAME"

      # Tasks are idempotent, so a failed run can be resumed.
      max_concurrent_runs: 1
      queue:
        enabled: true

      schedule:
        quartz_cron_expression: "0 0 7 * * ?"   # daily 07:00 — adjust or remove
        timezone_id: "America/Denver"
        pause_status: PAUSED

      # environment/team/ci_commit_sha are mandatory — governance rejects the
      # bundle without them, and `commit_sha` is not the key it looks for.
      tags:
        environment: ${bundle.target}
        team: ${var.team_tag}
        ci_commit_sha: ${var.commit_sha}
        project: ${var.project_tag}

      # One task per stage, chained with depends_on.
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../src/task_01_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              table_suffix: ${var.table_suffix}

        - task_key: transform
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../src/task_02_transform.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              table_suffix: ${var.table_suffix}

      email_notifications:
        on_failure:
          - ${var.team_email}
