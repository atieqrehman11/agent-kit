# TPLVAR_SLUG — a scheduled Databricks job as an Asset Bundle.
# stg and prod belong to the DAB CI/CD controller — never deploy them by hand.

bundle:
  name: TPLVAR_BUNDLE_NAME
  # Must match what the platform team registered; never change after first deploy.
  uuid: TPLVAR_BUNDLE_UUID

# The job resource lives in its own file. `resources.jobs` is the DAB schema
# collection key (always plural); the single resource key under it is yours.
include:
  - resources/*.yml

# Every per-environment value lives here, and nowhere else. The tasks take them
# as explicit base_parameters, so nothing in src/ names an environment.
variables:
  catalog:
    description: "Unity Catalog catalog every task reads and writes"
    default: "TPLVAR_CATALOG"

  schema:
    description: >-
      Target schema. A dev workspace often shares a general-purpose schema with
      other projects, which is why dev needs table_suffix; a dedicated schema
      per environment does not.
    default: "gold"

  table_suffix:
    description: "Suffix on every table name. Empty where the schema is dedicated"
    default: "_v0"

  team_email:
    description: "Notified on job failure"
    default: "TPLVAR_TEAM_EMAIL"

  # Unread by serverless tasks, but declared because deploy errors on an
  # undeclared --var. A classic cluster needs policy_id set per target.
  config_dir:
    description: "Unused — every task takes explicit base_parameters."
    default: ""

  policy_id:
    description: "Unused — the tasks are serverless, so there is no job cluster."
    default: ""

  team_tag:
    default: "TPLVAR_TEAM_TAG"

  project_tag:
    default: "TPLVAR_PROJECT_TAG"

  commit_sha:
    default: "local"

# run_as is required on stg/prod and rejected on dev. dev shares one root_path;
# stg/prod use the principal's own, since /Workspace/Shared is world-writable.
targets:
  dev:
    default: true

    workspace:
      host: TPLVAR_WORKSPACE_URL
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

    permissions:
      - group_name: TODO_SET_DEVELOPERS_GROUP
        level: CAN_MANAGE

  stg:
    workspace:
      host: TODO_SET_STG_WORKSPACE_HOST
      root_path: /Workspace/Users/TODO_SET_STG_SERVICE_PRINCIPAL/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: "TODO_SET_STG_SERVICE_PRINCIPAL"

    presets:
      trigger_pause_status: PAUSED

    variables:
      catalog: "TODO_SET_STG_CATALOG"
      schema: "gold"
      table_suffix: ""

    permissions:
      - group_name: TODO_SET_STG_DEVELOPERS_GROUP
        level: CAN_MANAGE

  prod:
    mode: production

    workspace:
      host: TODO_SET_PROD_WORKSPACE_HOST
      root_path: /Workspace/Users/TODO_SET_PROD_SERVICE_PRINCIPAL/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: "TODO_SET_PROD_SERVICE_PRINCIPAL"

    variables:
      catalog: "TODO_SET_PROD_CATALOG"
      schema: "gold"
      table_suffix: ""

    permissions:
      - group_name: TODO_SET_PROD_DEVELOPERS_GROUP
        level: CAN_RUN
