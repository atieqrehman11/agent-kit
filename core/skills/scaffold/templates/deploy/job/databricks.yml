bundle:
  name: TPLVAR_BUNDLE_NAME
  # Unique across all teams. Generated by the scaffold — do not change after the
  # first deploy (the controller identifies this bundle by uuid).
  uuid: TPLVAR_BUNDLE_UUID

# The job resource lives in its own file. `resources.jobs` is the DAB schema
# collection key (always plural); the single resource key under it is yours.
include:
  - resources/*.yml

variables:
  config_dir:
    description: "Per-target config directory (config/DEV|STG|PROD)"
    default: ""
  policy_id:
    description: "Job-cluster policy id that lets the principal create a cluster"
    default: "TODO_SET_DEV_POLICY_ID"
  team_tag:
    default: "TPLVAR_TEAM_TAG"
  project_tag:
    default: "TPLVAR_PROJECT_TAG"
  commit_sha:
    default: "local"

# ── Targets ──────────────────────────────────────────────────────────────────
# dev  = local dev loop  → deploy with ./bundle.sh (this laptop → dev workspace)
# stg  = cloud, deployed by the CI/CD controller on merge to the `stg` branch
# prod = cloud, deployed by the CI/CD controller on merge to the `prod` branch
# Never run `bundle deploy -t stg|prod` locally — that is the controller's job.
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: TPLVAR_WORKSPACE_URL
      root_path: /Workspace/Shared/TPLVAR_PROJECT/TPLVAR_SLUG/.bundle/${bundle.name}/${bundle.target}
    variables:
      config_dir: ${workspace.file_path}/config/DEV
      policy_id: TODO_SET_DEV_POLICY_ID

  stg:
    workspace:
      host: TODO_SET_STG_WORKSPACE_HOST
      root_path: /Workspace/Shared/TPLVAR_PROJECT/TPLVAR_SLUG/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: TODO_SET_STG_SERVICE_PRINCIPAL
    presets:
      trigger_pause_status: PAUSED
    variables:
      config_dir: ${workspace.file_path}/config/STG
      policy_id: TODO_SET_STG_POLICY_ID

  prod:
    mode: production
    workspace:
      host: TODO_SET_PROD_WORKSPACE_HOST
      root_path: /Workspace/Shared/TPLVAR_PROJECT/TPLVAR_SLUG/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: TODO_SET_PROD_SERVICE_PRINCIPAL
    variables:
      config_dir: ${workspace.file_path}/config/PROD
      policy_id: TODO_SET_PROD_POLICY_ID
