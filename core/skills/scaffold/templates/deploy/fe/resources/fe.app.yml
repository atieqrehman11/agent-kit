# Grants live per target in databricks.yml — a block here would reach prod.
# Renaming TPLVAR_RESOURCE_KEY recreates the app with a new client id and URL.
resources:
  apps:
    TPLVAR_RESOURCE_KEY:
      name: "TPLVAR_APP_NAME"
      description: "TPLVAR_DESCRIPTION"
      source_code_path: ${workspace.file_path}

      config:
        command:
          - node
          - server.mjs

        env:
          # Apps routes to a fixed port; a mismatch causes 502s.
          - name: PORT
            value: "8000"

          - name: BACKEND_API_URL
            value: ${var.backend_api_url}

          # sp = this app's own principal (needs CAN_USE on the API) | obo | none
          - name: BACKEND_API_AUTH
            value: ${var.backend_api_auth}

          - name: LOG_LEVEL
            value: ${var.log_level}

      # For obo: requesting a scope is what injects X-Forwarded-Access-Token.
      # user_api_scopes: [sql]
