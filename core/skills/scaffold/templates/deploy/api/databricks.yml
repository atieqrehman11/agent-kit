# TPLVAR_SLUG — a use case API deployed as a Databricks App.
# stg and prod belong to the DAB CI/CD controller — never deploy them by hand.

bundle:
  name: TPLVAR_BUNDLE_NAME
  # Must match what the platform team registered; never change after first deploy.
  uuid: TPLVAR_BUNDLE_UUID

# The apps resource lives in its own file.
include:
  - resources/*.yml

# The Apps build has no network, so dependencies ship as committed wheels. They
# must be BOTH tracked in git and synced here — the controller clones fresh.
sync:
  include:
    - wheels/**

# Every per-environment value lives here; api.app.yml turns them into the App's
# env. The unused ones exist because deploy errors on an undeclared --var.
variables:
  catalog:
    description: "Catalog holding the gold tables"
    default: "TPLVAR_CATALOG"

  gold_schema:
    default: "gold"

  warehouse_id:
    description: "SQL warehouse — gold-layer queries"
    default: "TODO_SET_WAREHOUSE_ID"

  cors_origins:
    description: 'JSON array of allowed browser origins. Never ["*"]'
    default: '["TODO_SET_FRONTEND_ORIGIN"]'

  config_dir:
    description: "Unused — no job tasks."
    default: ""

  policy_id:
    description: "Unused — no job clusters."
    default: ""

  team_tag:
    default: "TPLVAR_TEAM_TAG"

  project_tag:
    default: "TPLVAR_PROJECT_TAG"

  commit_sha:
    default: "local"

# run_as is required on stg/prod and rejected on dev. dev shares one root_path;
# stg/prod use the principal's own, since /Workspace/Shared is world-writable.
targets:
  # NOT `mode: development` — it would reject the shared root_path and prefix the
  # app name with `[dev <user>]`, renaming it away from TPLVAR_SLUG.
  dev:
    default: true

    workspace:
      host: TPLVAR_WORKSPACE_URL
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

    permissions:
      - group_name: TODO_SET_DEVELOPERS_GROUP
        level: CAN_MANAGE

    # A proxying front end needs CAN_USE as a RESOURCE-level grant or it 401s: a
    # target-level `permissions` entry validates but silently creates no ACL.
    resources:
      apps:
        TPLVAR_RESOURCE_KEY:
          permissions:
            - service_principal_name: "TODO_SET_FRONTEND_SP_ID"
              level: CAN_USE

  stg:
    workspace:
      host: TODO_SET_STG_WORKSPACE_HOST
      root_path: /Workspace/Users/TODO_SET_STG_SERVICE_PRINCIPAL/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: "TODO_SET_STG_SERVICE_PRINCIPAL"

    variables:
      catalog: "TODO_SET_STG_CATALOG"
      gold_schema: "gold"
      warehouse_id: "TODO_SET_STG_WAREHOUSE_ID"
      cors_origins: '["TODO_SET_STG_FRONTEND_ORIGIN"]'

    permissions:
      - group_name: TODO_SET_STG_DEVELOPERS_GROUP
        level: CAN_MANAGE

    # A different principal id per workspace, hence a per-target override.
    resources:
      apps:
        TPLVAR_RESOURCE_KEY:
          permissions:
            - service_principal_name: "TODO_SET_STG_FRONTEND_SP_ID"
              level: CAN_USE

  prod:
    mode: production

    workspace:
      host: TODO_SET_PROD_WORKSPACE_HOST
      root_path: /Workspace/Users/TODO_SET_PROD_SERVICE_PRINCIPAL/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: "TODO_SET_PROD_SERVICE_PRINCIPAL"

    variables:
      catalog: "TODO_SET_PROD_CATALOG"
      gold_schema: "gold"
      warehouse_id: "TODO_SET_PROD_WAREHOUSE_ID"
      cors_origins: '["TODO_SET_PROD_FRONTEND_ORIGIN"]'

    permissions:
      - group_name: TODO_SET_PROD_DEVELOPERS_GROUP
        level: CAN_RUN

    resources:
      apps:
        TPLVAR_RESOURCE_KEY:
          permissions:
            - service_principal_name: "TODO_SET_PROD_FRONTEND_SP_ID"
              level: CAN_USE
