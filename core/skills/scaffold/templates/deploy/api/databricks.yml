# TPLVAR_SLUG — a use case API deployed as a Databricks App.
# stg and prod belong to the DAB CI/CD controller — never deploy them by hand.

bundle:
  name: TPLVAR_BUNDLE_NAME
  # Unique across all teams. Generated by the scaffold — do not change after the
  # first deploy (the controller identifies this bundle by uuid), and it must
  # match what the platform team registered for you.
  uuid: TPLVAR_BUNDLE_UUID

# The apps resource lives in its own file. `resources.apps` is the DAB schema
# collection key (always plural); the single resource key under it is yours.
include:
  - resources/*.yml

# The Apps build environment has NO network, so every dependency ships as a
# committed wheel. wheels/ is tracked in git (see .gitignore) AND named here:
# relying on this line alone uploads whatever happens to be on the deploying
# laptop, and leaves the controller — which clones fresh — with nothing.
sync:
  include:
    - wheels/**

# Every per-environment value lives here; resources/api.app.yml turns them into
# the App's env. config_dir and policy_id exist only because the controller
# passes them and deploy errors on an undeclared --var.
variables:
  catalog:
    description: "Catalog holding the gold tables"
    default: "TPLVAR_CATALOG"

  gold_schema:
    default: "gold"

  warehouse_id:
    description: "SQL warehouse — gold-layer queries"
    default: "TODO_SET_WAREHOUSE_ID"

  cors_origins:
    description: 'JSON array of allowed browser origins. Never ["*"]'
    default: '["TODO_SET_FRONTEND_ORIGIN"]'

  config_dir:
    description: "Unused — no job tasks."
    default: ""

  policy_id:
    description: "Unused — no job clusters."
    default: ""

  team_tag:
    default: "TPLVAR_TEAM_TAG"

  project_tag:
    default: "TPLVAR_PROJECT_TAG"

  commit_sha:
    default: "local"

# run_as is required by the controller on stg/prod; dev has none because Apps
# reject a run_as that differs from the deploying identity, and you deploy dev
# yourself. root_path: dev is shared so the team manages one app; stg/prod use
# the principal's own folder, as /Workspace/Shared is writable by every user.
targets:
  # NOT `mode: development` — it would reject the shared root_path and prefix the
  # app name with `[dev <user>]`, renaming it away from TPLVAR_SLUG.
  dev:
    default: true

    workspace:
      host: TPLVAR_WORKSPACE_URL
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

    permissions:
      - group_name: TODO_SET_DEVELOPERS_GROUP
        level: CAN_MANAGE

    # A front end that reverse-proxies to this API needs CAN_USE with its own app
    # identity, or every proxied call 401s. It has to be a RESOURCE-level grant:
    # a target-level `permissions` entry for a service principal validates but
    # silently creates no ACL. Overriding the resource inside the target keeps it
    # per-workspace — each mints the app a different principal.
    resources:
      apps:
        TPLVAR_RESOURCE_KEY:
          permissions:
            - service_principal_name: "TODO_SET_FRONTEND_SP_ID"
              level: CAN_USE

  stg:
    workspace:
      host: TODO_SET_STG_WORKSPACE_HOST
      root_path: /Workspace/Users/TODO_SET_STG_SERVICE_PRINCIPAL/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: "TODO_SET_STG_SERVICE_PRINCIPAL"

    variables:
      catalog: "TODO_SET_STG_CATALOG"
      gold_schema: "gold"
      warehouse_id: "TODO_SET_STG_WAREHOUSE_ID"
      cors_origins: '["TODO_SET_STG_FRONTEND_ORIGIN"]'

    permissions:
      - group_name: TODO_SET_STG_DEVELOPERS_GROUP
        level: CAN_MANAGE

    # The front end's principal in this workspace — a different id from dev's,
    # which is why this is a per-target override rather than a shared block.
    resources:
      apps:
        TPLVAR_RESOURCE_KEY:
          permissions:
            - service_principal_name: "TODO_SET_STG_FRONTEND_SP_ID"
              level: CAN_USE

  prod:
    mode: production

    workspace:
      host: TODO_SET_PROD_WORKSPACE_HOST
      root_path: /Workspace/Users/TODO_SET_PROD_SERVICE_PRINCIPAL/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: "TODO_SET_PROD_SERVICE_PRINCIPAL"

    variables:
      catalog: "TODO_SET_PROD_CATALOG"
      gold_schema: "gold"
      warehouse_id: "TODO_SET_PROD_WAREHOUSE_ID"
      cors_origins: '["TODO_SET_PROD_FRONTEND_ORIGIN"]'

    permissions:
      - group_name: TODO_SET_PROD_DEVELOPERS_GROUP
        level: CAN_RUN

    resources:
      apps:
        TPLVAR_RESOURCE_KEY:
          permissions:
            - service_principal_name: "TODO_SET_PROD_FRONTEND_SP_ID"
              level: CAN_USE
