# ── App resource ─────────────────────────────────────────────────────────────
# `resources.apps` is the DAB schema collection key (always plural, even for one
# app). TPLVAR_RESOURCE_KEY is the single resource key — `databricks bundle run
# TPLVAR_RESOURCE_KEY` targets it. Renaming it makes DAB destroy and recreate the
# app, minting a new client id, secret and URL.
#
# NO app.yml at the source root. Databricks Apps supports either, but a root
# app.yml is uploaded VERBATIM — it cannot hold a per-environment value, so every
# target would get dev's warehouse and dev's CORS origin. The `config:` block
# here goes through DAB variable resolution, which is the whole point.
#
# NO permissions here either. A resource-level block applies to EVERY target, so
# a dev group named here would reach prod. Grants live per target in
# databricks.yml — including the frontend's CAN_USE, which must be a resource
# override nested inside the target (a target-level `permissions:` entry for a
# service principal validates but silently creates no ACL).
#
# source_code_path is the app root in the workspace, so it must be the folder
# holding app.py.
resources:
  apps:
    TPLVAR_RESOURCE_KEY:
      name: "TPLVAR_SLUG"
      description: "TPLVAR_DESCRIPTION"
      source_code_path: ${workspace.file_path}

      config:
        # Apps routes to a fixed port; a mismatch is a 502.
        command:
          - uvicorn
          - app:app
          - --host
          - 0.0.0.0
          - --port
          - "8000"

        # Every name below maps to a field on Settings in core/config.py. Nothing
        # reads an env var directly — add the field there first, or the value is
        # silently ignored.
        env:
          # ── Observability ───────────────────────────────────────────────────
          # Flip to DEBUG here to get debug logs. No code change, no rebuild.
          - name: LOG_LEVEL
            value: "INFO"
          - name: LOG_FORMAT
            value: "json"

          # ── Boundary ────────────────────────────────────────────────────────
          # A JSON array of allowed origins. Never ["*"].
          - name: CORS_ORIGINS
            value: ${var.cors_origins}

          # ── SQL warehouse (gold-layer queries) ──────────────────────────────
          - name: DATABRICKS_WAREHOUSE_ID
            value: ${var.warehouse_id}
          - name: DATABRICKS_HTTP_PATH
            value: /sql/1.0/warehouses/${var.warehouse_id}
          - name: DATABRICKS_CATALOG
            value: ${var.catalog}
          - name: DATABRICKS_GOLD_SCHEMA
            value: ${var.gold_schema}
          - name: TABLE_PREFIX
            value: "TPLVAR_RAW_PREFIX"
