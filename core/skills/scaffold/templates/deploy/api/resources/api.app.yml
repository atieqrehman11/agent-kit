# Renaming TPLVAR_RESOURCE_KEY recreates the app with a new client id and URL.
# Grants live per target in databricks.yml; a block here would reach prod.
resources:
  apps:
    TPLVAR_RESOURCE_KEY:
      name: "TPLVAR_APP_NAME"
      description: "TPLVAR_DESCRIPTION"
      source_code_path: ${workspace.file_path}

      config:
        # Apps routes to a fixed port; a mismatch is a 502.
        command:
          - uvicorn
          - app:app
          - --host
          - 0.0.0.0
          - --port
          - "8000"

        # Each name maps to a Settings field in core/config.py; nothing reads env
        # directly, so an unlisted var is silently ignored.
        env:
          - name: LOG_LEVEL
            value: "INFO"
          - name: LOG_FORMAT
            value: "json"

          # JSON array of allowed origins. Never ["*"].
          - name: CORS_ORIGINS
            value: ${var.cors_origins}

          - name: DATABRICKS_WAREHOUSE_ID
            value: ${var.warehouse_id}
          - name: DATABRICKS_HTTP_PATH
            value: /sql/1.0/warehouses/${var.warehouse_id}
          - name: DATABRICKS_CATALOG
            value: ${var.catalog}
          - name: DATABRICKS_GOLD_SCHEMA
            value: ${var.gold_schema}
          - name: TABLE_PREFIX
            value: "TPLVAR_RAW_PREFIX"
