# The job IS the deploy: `bundle run deploy_agent` reconciles the agent against
# /api/2.1/supervisor-agents. Serverless — the task only makes REST calls.
resources:
  jobs:
    deploy_agent:
      name: "TPLVAR_SLUG-deploy"

      tasks:
        - task_key: deploy
          environment_key: default
          spark_python_task:
            python_file: ${workspace.file_path}/python/deploy_agent.py
            parameters:
              - "--spec-dir=${workspace.file_path}/src"
              - "--var=display_name=${var.agent_display_name}"
              - "--var=genie_space_id=${var.genie_space_id}"
              - "--var=vector_search_index=${var.vector_search_index}"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - pyyaml>=6.0

      # Two reconcilers racing would fight over the tool set.
      max_concurrent_runs: 1

      # environment/team/ci_commit_sha are mandatory — governance rejects the
      # bundle without them, and `commit_sha` is not the key it looks for.
      tags:
        environment: ${bundle.target}
        team: ${var.team_tag}
        ci_commit_sha: ${var.commit_sha}
        project: ${var.project_tag}
