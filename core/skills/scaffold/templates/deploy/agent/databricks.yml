# TPLVAR_SLUG — an Agent Bricks supervisor agent, as config-as-code.
# stg and prod belong to the DAB CI/CD controller — never deploy them by hand.

# Not a DAB resource type, so the bundle's one resource is a job that runs the
# reconciler — see resources/deploy.job.yml.

bundle:
  name: TPLVAR_BUNDLE_NAME
  # Must match what the platform team registered; never change after first deploy.
  uuid: TPLVAR_BUNDLE_UUID

include:
  - resources/*.yml

# Every per-environment value lives here; src/ sees them as ${name} via --var.
# The unused ones are declared because deploy errors on an undeclared --var.
variables:
  agent_display_name:
    description: "Supervisor identity in the workspace — the agent is found by this name"
    default: "TPLVAR_DISPLAY_NAME"

  genie_space_id:
    description: "Genie space attached as a tool. Workspace-local, so it differs per env"
    default: "TODO_SET_GENIE_SPACE_ID"

  vector_search_index:
    description: "Vector Search index attached as a tool, <catalog>.<schema>.<index>"
    default: "TODO_SET_VECTOR_SEARCH_INDEX"

  config_dir:
    description: "Unused — the task takes explicit parameters."
    default: ""

  policy_id:
    description: "Unused — the deploy task is serverless, so there is no job cluster."
    default: ""

  team_tag:
    default: "TPLVAR_TEAM_TAG"

  project_tag:
    default: "TPLVAR_PROJECT_TAG"

  commit_sha:
    default: "local"

# run_as is required on stg/prod and rejected on dev. dev shares one root_path;
# stg/prod use the principal's own, since /Workspace/Shared is world-writable.
targets:
  dev:
    default: true

    workspace:
      host: TPLVAR_WORKSPACE_URL
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

    permissions:
      - group_name: TODO_SET_DEVELOPERS_GROUP
        level: CAN_MANAGE

  stg:
    workspace:
      host: TODO_SET_STG_WORKSPACE_HOST
      root_path: /Workspace/Users/TODO_SET_STG_SERVICE_PRINCIPAL/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: "TODO_SET_STG_SERVICE_PRINCIPAL"

    variables:
      agent_display_name: "TPLVAR_DISPLAY_NAME [STG]"
      genie_space_id: "TODO_SET_STG_GENIE_SPACE_ID"
      vector_search_index: "TODO_SET_STG_VECTOR_SEARCH_INDEX"

    permissions:
      - group_name: TODO_SET_STG_DEVELOPERS_GROUP
        level: CAN_MANAGE

  prod:
    mode: production

    workspace:
      host: TODO_SET_PROD_WORKSPACE_HOST
      root_path: /Workspace/Users/TODO_SET_PROD_SERVICE_PRINCIPAL/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: "TODO_SET_PROD_SERVICE_PRINCIPAL"

    variables:
      agent_display_name: "TPLVAR_DISPLAY_NAME [PROD]"
      genie_space_id: "TODO_SET_PROD_GENIE_SPACE_ID"
      vector_search_index: "TODO_SET_PROD_VECTOR_SEARCH_INDEX"

    permissions:
      - group_name: TODO_SET_PROD_DEVELOPERS_GROUP
        level: CAN_RUN
