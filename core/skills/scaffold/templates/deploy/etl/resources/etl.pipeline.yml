# catalog/target must stay ${var.*}: a literal survives the target override and
# points a stg deploy at the dev catalog. Library paths are relative to this file.
resources:
  pipelines:
    TPLVAR_RESOURCE_KEY:
      name: "TPLVAR_SLUG-etl"
      catalog: ${var.catalog}
      target: ${var.schema}
      # The only channel a per-environment value reaches a task by (spark.conf.get).
      configuration:
        pipeline.catalog: ${var.catalog}
        pipeline.schema: ${var.schema}
        pipeline.table_prefix: "TPLVAR_RAW_PREFIX"
        pipeline.source_volume: ${var.source_volume}

      channel: "CURRENT"
      serverless: true
      continuous: false
      development: false
      libraries:
        - file:
            path: ../pipeline/task1_ingestion.py
        - file:
            path: ../pipeline/task2_parse_extract.py
        - file:
            path: ../pipeline/task3_chunk_classify.py
        - file:
            path: ../pipeline/task4_embeddings_vectorindex.py
