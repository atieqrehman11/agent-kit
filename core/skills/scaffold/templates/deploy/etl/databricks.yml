# TPLVAR_SLUG — a Lakeflow declarative pipeline as an Asset Bundle.
# stg and prod belong to the DAB CI/CD controller — never deploy them by hand.

bundle:
  name: TPLVAR_BUNDLE_NAME
  # Must match what the platform team registered; never change after first deploy.
  uuid: TPLVAR_BUNDLE_UUID

# The pipeline resource lives in its own file.
include:
  - resources/*.yml

# Every per-environment value lives here, and nowhere else.
variables:
  catalog:
    description: "Unity Catalog catalog the pipeline reads and writes"
    default: "TPLVAR_CATALOG"

  schema:
    description: >-
      The pipeline's default target schema — where a table lands when its
      definition does not qualify it. `bronze` for a medallion pipeline that
      writes its own silver and gold names explicitly.
    default: "bronze"

  source_volume:
    description: "Volume path the ingestion task reads"
    default: "/Volumes/TPLVAR_CATALOG/bronze/unstructured_data/TPLVAR_SLUG/"

  # Unread by a pipeline, but declared because deploy errors on an undeclared --var.
  config_dir:
    description: "Unused — no job tasks."
    default: ""

  policy_id:
    description: "Unused — pipeline compute is configured on the pipeline itself."
    default: ""

  team_tag:
    default: "TPLVAR_TEAM_TAG"

  project_tag:
    default: "TPLVAR_PROJECT_TAG"

  commit_sha:
    default: "local"

# run_as is required on stg/prod and rejected on dev. dev shares one root_path;
# stg/prod use the principal's own, since /Workspace/Shared is world-writable.
targets:
  dev:
    default: true

    workspace:
      host: TPLVAR_WORKSPACE_URL
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

    permissions:
      - group_name: TODO_SET_DEVELOPERS_GROUP
        level: CAN_MANAGE

  stg:
    workspace:
      host: TODO_SET_STG_WORKSPACE_HOST
      root_path: /Workspace/Users/TODO_SET_STG_SERVICE_PRINCIPAL/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: "TODO_SET_STG_SERVICE_PRINCIPAL"

    variables:
      catalog: "TODO_SET_STG_CATALOG"
      schema: "bronze"
      source_volume: "TODO_SET_STG_SOURCE_VOLUME"

    permissions:
      - group_name: TODO_SET_STG_DEVELOPERS_GROUP
        level: CAN_MANAGE

  prod:
    mode: production

    workspace:
      host: TODO_SET_PROD_WORKSPACE_HOST
      root_path: /Workspace/Users/TODO_SET_PROD_SERVICE_PRINCIPAL/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: "TODO_SET_PROD_SERVICE_PRINCIPAL"

    variables:
      catalog: "TODO_SET_PROD_CATALOG"
      schema: "bronze"
      source_volume: "TODO_SET_PROD_SOURCE_VOLUME"

    permissions:
      - group_name: TODO_SET_PROD_DEVELOPERS_GROUP
        level: CAN_RUN
