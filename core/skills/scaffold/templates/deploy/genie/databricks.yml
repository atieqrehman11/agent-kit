# TPLVAR_SLUG — a Genie space as an Asset Bundle.
# stg and prod belong to the DAB CI/CD controller — never deploy them by hand.

# genie_spaces needs `engine: direct` and CLI 1.3.0+, or this does not parse.

bundle:
  name: TPLVAR_BUNDLE_NAME
  # Must match what the platform team registered; never change after first deploy.
  uuid: TPLVAR_BUNDLE_UUID
  engine: direct

include:
  - resources/*.yml

# Every per-environment value lives here: DAB reads space_title/warehouse_id at
# deploy, build_space.py bakes catalog/schema into the artifact.
variables:
  space_title:
    description: "Space identity in the workspace"
    default: "TPLVAR_DISPLAY_NAME"

  warehouse_id:
    description: "SQL warehouse that runs this space's queries"
    default: "TODO_SET_WAREHOUSE_ID"

  catalog:
    description: "Catalog the space reads — baked into the artifact at build time"
    default: "TPLVAR_CATALOG"

  schema:
    description: "Schema the space reads — baked in at build time"
    default: "gold"

  config_dir:
    description: "Unused — no job tasks."
    default: ""

  policy_id:
    description: "Unused — no job clusters."
    default: ""

  team_tag:
    default: "TPLVAR_TEAM_TAG"

  project_tag:
    default: "TPLVAR_PROJECT_TAG"

  commit_sha:
    default: "local"

# run_as is required on stg/prod and rejected on dev. dev shares one root_path;
# stg/prod use the principal's own, since /Workspace/Shared is world-writable.
targets:
  dev:
    default: true

    workspace:
      host: TPLVAR_WORKSPACE_URL
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

    permissions:
      - group_name: TODO_SET_DEVELOPERS_GROUP
        level: CAN_MANAGE

  stg:
    workspace:
      host: TODO_SET_STG_WORKSPACE_HOST
      root_path: /Workspace/Users/TODO_SET_STG_SERVICE_PRINCIPAL/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: "TODO_SET_STG_SERVICE_PRINCIPAL"

    variables:
      space_title: "TPLVAR_DISPLAY_NAME [STG]"
      warehouse_id: "TODO_SET_STG_WAREHOUSE_ID"
      catalog: "TODO_SET_STG_CATALOG"
      schema: "gold"

    permissions:
      - group_name: TODO_SET_STG_DEVELOPERS_GROUP
        level: CAN_MANAGE

  prod:
    mode: production

    workspace:
      host: TODO_SET_PROD_WORKSPACE_HOST
      root_path: /Workspace/Users/TODO_SET_PROD_SERVICE_PRINCIPAL/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: "TODO_SET_PROD_SERVICE_PRINCIPAL"

    variables:
      space_title: "TPLVAR_DISPLAY_NAME [PROD]"
      warehouse_id: "TODO_SET_PROD_WAREHOUSE_ID"
      catalog: "TODO_SET_PROD_CATALOG"
      schema: "gold"

    permissions:
      - group_name: TODO_SET_PROD_DEVELOPERS_GROUP
        level: CAN_RUN
