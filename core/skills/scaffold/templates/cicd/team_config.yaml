# ============================================================================
# TEAM / BUNDLE REGISTRATION — read by the DAB CI/CD controller
# ============================================================================
# One entry per bundle. The controller uses bundle_name + uuid to identify and
# deploy this repo. The uuid below was generated by the scaffold and must stay
# unique across all teams — do not reuse or regenerate it after the first deploy.
# ============================================================================

team_name: "TPLVAR_TEAM_NAME"          # unique across all teams
team_email: "TPLVAR_TEAM_EMAIL"        # team Ops email

service_principals:
  - TODO_SET_PROD_SERVICE_PRINCIPAL: "TODO_SET_PROD_SP_ID"
  - TODO_SET_STG_SERVICE_PRINCIPAL: "TODO_SET_STG_SP_ID"

repositories:
  - bundle_name: "TPLVAR_BUNDLE_NAME"   # = bundle.name in databricks.yml, = BUNDLE_TAG in .gitlab-ci.yml
    url: "TODO_SET_REPO_URL"            # project repo url without .git
    uuid: "TPLVAR_BUNDLE_UUID"          # = bundle.uuid in databricks.yml; unique across all teams
    data_sensitivity: "TPLVAR_DATA_SENSITIVITY"
    # high_performance_cluster:         # optional
    #   policy_ids:
    #     - "TODO_SET_POLICY_ID"
