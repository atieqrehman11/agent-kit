[project]
name = "TPLVAR_RESOURCE_KEY"
version = "0.1.0"
description = "TPLVAR_DESCRIPTION"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
