# ============================================================================
# GITLAB CI/CD — front end deployed as a Databricks App
# ============================================================================
# This repo deploys ITSELF. It does not trigger the shared DAB controller like
# the api / etl / job bundles do, and the reason is structural rather than a
# preference: the controller deploys from a git checkout and runs no Node build,
# so it would deploy a repo whose dist/ does not exist. dist/ is a build
# artifact and is not committed, so the build has to happen in the same job that
# deploys — which means this job needs workspace credentials of its own.
#
#   • Local dev loop  → ./bundle.sh on your laptop (builds, then deploys to DEV).
#   • Cloud stg/prod  → merge to the `stg` / `prod` branch → this pipeline.
#
# Credentials: set DATABRICKS_TOKEN in Settings > CI/CD > Variables (masked),
# scoped to the `stg` and `prod` branches SEPARATELY — the two branches must not
# be able to reach each other's workspace. The host is not a variable: it comes
# from the matching target in databricks.yml, so there is one answer to "which
# workspace is stg".
#
# If your controller later gains a Node build stage, replace the deploy jobs
# below with the controller-trigger form the other bundle types use. Nothing
# else in the repo has to change.
# ============================================================================

stages:
  - verify
  - deploy

variables:
  GITLAB_RUNNER: "TPLVAR_GITLAB_RUNNER"
  BUNDLE_TAG: "TPLVAR_BUNDLE_NAME" # must match bundle.name in databricks.yml
  TEAM_TAG: "TPLVAR_TEAM_TAG"

default:
  tags:
    - $GITLAB_RUNNER
  image: TODO_SET_CI_IMAGE

.node_build:
  before_script:
    - node --version
    - npm --version
    - npm ci
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

# ── Verify on every push / MR ────────────────────────────────────────────────
# format → lint → types → tests → build → bundle budget. The budget is a
# FAILING check, not a warning: a size limit nobody's build fails on is a
# preference, and front-end bundles only ever grow.
verify:
  extends: .node_build
  stage: verify
  script:
    - npm run verify
  artifacts:
    when: on_failure
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ── Deploy (cloud) ───────────────────────────────────────────────────────────
# Build and deploy in ONE job. Splitting them means passing dist/ between jobs
# as an artifact and hoping the two ran on the same commit.
.deploy:
  extends: .node_build
  stage: deploy
  script:
    - npm run build
    - test -f dist/index.html || (echo "ERROR: build produced no dist/index.html" && exit 1)
    - databricks bundle validate -t "$TARGET_ENV"
    - databricks bundle deploy -t "$TARGET_ENV"
    - databricks bundle run TPLVAR_RESOURCE_KEY -t "$TARGET_ENV"

deploy_stg:
  extends: .deploy
  variables:
    TARGET_ENV: stg
  environment:
    name: stg
  rules:
    - if: $CI_COMMIT_BRANCH == "stg"
      when: manual

deploy_prod:
  extends: .deploy
  variables:
    TARGET_ENV: prod
  environment:
    name: prod
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual # keep manual for production safety
