bundle:
  name: TPLVAR_BUNDLE_NAME
  # Unique across all teams. Generated by the scaffold — do not change after the
  # first deploy (the app resource is keyed on this bundle).
  uuid: TPLVAR_BUNDLE_UUID

# The apps resource lives in its own file. `resources.apps` is the DAB schema
# collection key (always plural); the single resource key under it is yours.
include:
  - resources/*.yml

variables:
  team_tag:
    default: "TPLVAR_TEAM_TAG"
  project_tag:
    default: "TPLVAR_PROJECT_TAG"
  commit_sha:
    default: "local"

# ── Targets ──────────────────────────────────────────────────────────────────
# Every target deploys the SAME thing: dist/ + server.mjs + app.yml. dist/ is a
# build artifact and is not committed, so `npm ci && npm run build` must run
# before `bundle deploy` on every target — locally that is ./bundle.sh, in CI it
# is the build stage in .gitlab-ci.yml.
#
# dev  = local dev loop     → ./bundle.sh (this laptop → dev workspace)
# stg  = cloud, deployed by this repo's own pipeline on merge to `stg`
# prod = cloud, deployed by this repo's own pipeline on merge to `prod`
#
# Unlike the api/etl/job bundles this repo does NOT go through the shared DAB
# controller: the controller deploys from a git checkout and does not run a Node
# build, so it would deploy a repo with no dist/. The pipeline here builds first
# and then deploys the bundle itself. If your controller gains a Node build
# stage, switch .gitlab-ci.yml to the controller-trigger form the other bundle
# types use — nothing in this file has to change.
#
# The host below is what `bundle deploy -t <target>` targets. CI supplies only
# DATABRICKS_TOKEN; setting DATABRICKS_HOST as well would give two answers to
# the same question.
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: TPLVAR_WORKSPACE_URL
      root_path: /Workspace/Shared/TPLVAR_PROJECT/TPLVAR_SLUG/.bundle/${bundle.name}/${bundle.target}

  stg:
    workspace:
      host: TODO_SET_STG_WORKSPACE_HOST
      root_path: /Workspace/Shared/TPLVAR_PROJECT/TPLVAR_SLUG/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: TODO_SET_STG_SERVICE_PRINCIPAL
    presets:
      name_prefix: "[stg] "

  prod:
    mode: production
    workspace:
      host: TODO_SET_PROD_WORKSPACE_HOST
      root_path: /Workspace/Shared/TPLVAR_PROJECT/TPLVAR_SLUG/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: TODO_SET_PROD_SERVICE_PRINCIPAL
    permissions:
      - user_name: TODO_SET_PROD_ADMIN_USER
        level: CAN_MANAGE
