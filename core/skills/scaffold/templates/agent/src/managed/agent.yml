# The managed (Agent Bricks) supervisor agent — SOURCE OF TRUTH.
# UI edits are overwritten on the next deploy; edit here instead.

# ${...} comes from the deploy job's --var, filled per target in databricks.yml.
# An unresolved ${name} fails the deploy rather than reaching the API.

display_name: ${display_name}

description: >-
  TPLVAR_DESCRIPTION

# Sent byte-verbatim as the system prompt. Its own file so a diff is one file and
# an editor cannot reflow it as a YAML string.
instructions_file: instructions.md

# Reconciled by tool_id: a tool on the live agent that is NOT declared here is
# DELETED. A spec is immutable, so changing it replaces the tool.

# `description` is routing guidance the supervisor reads, not documentation —
# say what the tool does NOT cover, or it gets wrong routes.

# Confirm tool_type names for your workspace:
# https://docs.databricks.com/aws/en/generative-ai/agent-bricks/multi-agent-supervisor
tools:
  - tool_id: TODO-rename-me
    tool_type: genie_space
    genie_space:
      id: ${genie_space_id}
    description: >-
      TODO: what this space answers, and what it does not. e.g. "Structured
      registry — one row per document, covering dates, status and counterparties.
      Metadata only: it holds no document text."

