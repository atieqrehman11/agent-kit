# Multi-Agent Supervisor deploy — management API, not a DAB bundle, so no
# controller. Both jobs just run a script in this repo; nothing here is logic you
# cannot run locally.
#
# Needs DATABRICKS_HOST + DATABRICKS_TOKEN in GitLab CI/CD variables, scoped per
# branch — the workspace is what separates stg from prod (AGENT_STANDARDS §3a).

stages:
  - validate
  - deploy

variables:
  GITLAB_RUNNER: "TPLVAR_GITLAB_RUNNER"

validate:
  stage: validate
  tags:
    - $GITLAB_RUNNER
  image: TODO_SET_CI_IMAGE
  script:
    - pip install -q pyyaml
    - python src/validate.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

deploy:
  stage: deploy
  tags:
    - $GITLAB_RUNNER
  image: TODO_SET_CI_IMAGE
  script:
    - pip install -q -r requirements.txt
    - python src/deploy.py --env "$CI_COMMIT_BRANCH"
  rules:
    - if: $CI_COMMIT_BRANCH == "stg"
      when: manual
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual
