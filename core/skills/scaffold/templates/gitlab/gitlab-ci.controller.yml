# GITLAB CI/CD — TPLVAR_SLUG
#
# Never deploys. Validates the bundle config and triggers the shared DAB CI/CD
# controller, which deploys the bundle into the stg / prod workspaces.
#
#   dev   local: ./run_local.sh deploy
#   stg   automatic on merge
#   prod  manual — play button in Build → Pipelines
#
# CONTROLLER_TRIGGER_TOKEN is a protected group variable — stg and prod must stay
# PROTECTED branches, or the trigger silently receives an empty token and the job
# still goes green.

stages:
  - validate
  - trigger-deploy

variables:
  GITLAB_RUNNER: "TPLVAR_GITLAB_RUNNER"
  CONTROLLER_PROJECT_ID: "TPLVAR_CONTROLLER_PROJECT_ID"
  BUNDLE_TAG: "TPLVAR_BUNDLE_NAME"        # must match bundle.name in databricks.yml
  TEAM_TAG: "TPLVAR_TEAM_TAG"
  DATABRICKS_CI_IMAGE: "TODO_SET_CI_IMAGE"

default:
  tags:
    - $GITLAB_RUNNER      # an untagged job is never picked up

validate:
  stage: validate
  image: $DATABRICKS_CI_IMAGE
  script:
    - |-
      if [ ! -f "databricks.yml" ]; then
        echo "ERROR: databricks.yml not found"; exit 1
      fi
    - echo "✓ Bundle configuration exists"
    # A repo that ships python/validate.py checks its own declaration here — the
    # offline check is the one that catches a bad spec before the controller
    # applies it. Repos without one skip this silently.
    - |-
      if [ -f "python/validate.py" ]; then
        pip install --quiet "pyyaml>=6.0"
        PYTHONPATH=python python3 python/validate.py
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ref=prod is the CONTROLLER's release branch, not our target env.
#
# No `image:` here on purpose — the databricks-ci image has no CA bundle at the
# path its curl expects, so a trigger run there dies with `curl: (77)`. The
# runner default has a working curl.
#
# Two failure modes are checked separately: curl's own exit code (DNS, TLS,
# connection) and the HTTP status — curl exits 0 on 4xx/5xx, so a rejected
# trigger would otherwise be a green job that deployed nothing.
# Green means ACCEPTED; the deploy runs in the controller's pipeline.
.trigger-controller:
  stage: trigger-deploy
  script:
    - |-
      rc=0
      response=$(curl -sS -X POST \
        -F "token=$CONTROLLER_TRIGGER_TOKEN" \
        -F ref=prod \
        -F "variables[PROJECT_REPO_URL]=$CI_PROJECT_URL" \
        -F "variables[PROJECT_REPO_REF]=$CI_COMMIT_REF_NAME" \
        -F "variables[PROJECT_REPO_SHA]=$CI_COMMIT_SHA" \
        -F "variables[TARGET_ENV]=$TARGET_ENV" \
        -F "variables[BUNDLE_TAG]=$BUNDLE_TAG" \
        -F "variables[TEAM_TAG]=$TEAM_TAG" \
        -F "variables[TEAM_TRIGGER_TOKEN]=$CONTROLLER_TRIGGER_TOKEN" \
        -w '\n%{http_code}' \
        "https://gitlab.com/api/v4/projects/$CONTROLLER_PROJECT_ID/trigger/pipeline") || rc=$?
      if [ "$rc" -ne 0 ]; then
        echo "ERROR: curl could not reach the controller API (exit $rc)."
        echo "Exit 77 means a missing CA bundle — check this job's image."
        exit 1
      fi
      status=$(printf '%s' "$response" | tail -n1)
      printf '%s\n' "$response" | sed '$d'
      # `case`, not a numeric test: an arithmetic comparison on an empty status
      # errors, and `if` reads that as false — passing the job.
      case "$status" in
        2??) echo "✓ Controller pipeline triggered for $TARGET_ENV (HTTP $status)" ;;
        *)   echo "ERROR: controller trigger failed — HTTP '$status'"
             echo "Check CONTROLLER_TRIGGER_TOKEN is set and this branch is protected."
             exit 1 ;;
      esac

trigger_deploy_stg:
  extends: .trigger-controller
  variables:
    TARGET_ENV: stg
  rules:
    - if: $CI_COMMIT_BRANCH == "stg"

trigger_deploy_prod:
  extends: .trigger-controller
  variables:
    TARGET_ENV: prod
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual   # keep manual for production safety
