# TPLVAR_SLUG — validates, then triggers the controller. Never deploys.
# stg/prod must stay PROTECTED or the trigger gets an empty token and goes green.

stages:
  - validate
  - trigger-deploy

variables:
  GITLAB_RUNNER: "TPLVAR_GITLAB_RUNNER"
  CONTROLLER_PROJECT_ID: "TPLVAR_CONTROLLER_PROJECT_ID"
  BUNDLE_TAG: "TPLVAR_BUNDLE_NAME"        # must match bundle.name in databricks.yml
  TEAM_TAG: "TPLVAR_TEAM_TAG"
  DATABRICKS_CI_IMAGE: "TODO_SET_CI_IMAGE"

default:
  tags:
    - $GITLAB_RUNNER      # an untagged job is never picked up

validate:
  stage: validate
  image: $DATABRICKS_CI_IMAGE
  script:
    - |-
      if [ ! -f "databricks.yml" ]; then
        echo "ERROR: databricks.yml not found"; exit 1
      fi
    - echo "✓ Bundle configuration exists"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ref=prod is the CONTROLLER's release branch, not our target env. No `image:`:
# the databricks-ci curl has no CA bundle and dies with `curl: (77)`.
.trigger-controller:
  stage: trigger-deploy
  script:
    - |-
      rc=0
      response=$(curl -sS -X POST \
        -F "token=$CONTROLLER_TRIGGER_TOKEN" \
        -F ref=prod \
        -F "variables[PROJECT_REPO_URL]=$CI_PROJECT_URL" \
        -F "variables[PROJECT_REPO_REF]=$CI_COMMIT_REF_NAME" \
        -F "variables[PROJECT_REPO_SHA]=$CI_COMMIT_SHA" \
        -F "variables[TARGET_ENV]=$TARGET_ENV" \
        -F "variables[BUNDLE_TAG]=$BUNDLE_TAG" \
        -F "variables[TEAM_TAG]=$TEAM_TAG" \
        -F "variables[TEAM_TRIGGER_TOKEN]=$CONTROLLER_TRIGGER_TOKEN" \
        -w '\n%{http_code}' \
        "https://gitlab.com/api/v4/projects/$CONTROLLER_PROJECT_ID/trigger/pipeline") || rc=$?
      if [ "$rc" -ne 0 ]; then
        echo "ERROR: curl could not reach the controller API (exit $rc)."
        echo "Exit 77 means a missing CA bundle — check this job's image."
        exit 1
      fi
      status=$(printf '%s' "$response" | tail -n1)
      printf '%s\n' "$response" | sed '$d'
      # `case`, not a numeric test: an empty status errors and `if` passes the job.
      case "$status" in
        2??) echo "✓ Controller pipeline triggered for $TARGET_ENV (HTTP $status)" ;;
        *)   echo "ERROR: controller trigger failed — HTTP '$status'"
             echo "Check CONTROLLER_TRIGGER_TOKEN is set and this branch is protected."
             exit 1 ;;
      esac

trigger_deploy_stg:
  extends: .trigger-controller
  variables:
    TARGET_ENV: stg
  rules:
    - if: $CI_COMMIT_BRANCH == "stg"

trigger_deploy_prod:
  extends: .trigger-controller
  variables:
    TARGET_ENV: prod
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual   # keep manual for production safety
